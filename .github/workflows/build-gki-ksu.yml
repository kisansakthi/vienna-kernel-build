name: build vienna GKI + OFFICIAL KSU-Next built-in (WITHOUT susfs)

# Phase 2, owner's decision "no susfs" (2026-08-25): PURE GKI `common` @d77c4cd65aed
# (tag android14-6.1-2025-07_r11, SUBLEVEL=141), STOCK AOSP WORKSPACE (the MTK one was the
# root cause of the panic; proven: the bare common BOOTS) + OFFICIAL KernelSU-Next v3.3.0 built-in.
# No susfs => no glue, no fork, no 50_/60_, no base.c: 100% official dev, manager aligned.
# Vermagic comes naturally from git (commit checkout), kept clean with `git update-index
# --assume-unchanged` on the files the KSU setup modifies (otherwise git-describe would turn -dirty).
on:
  workflow_dispatch:
    inputs:
      gki_tag: { default: "android14-6.1-2026-03_r9" }
      manifest_branch: { default: "common-android14-6.1" }
      target: { default: "//common:kernel_aarch64_dist" }
      ksun_ref: { default: "v3.3.0" }
      use_droidspaces: { type: boolean, default: true }
      # Set BOTH use_droidspaces and use_ksu false for an isolation build: a pure
      # stock GKI rebuild. If that also bootloops, the kernel content was never the
      # variable and the fault is in how the boot image is packed or flashed.
      use_ksu: { type: boolean, default: true }
  workflow_call:
    inputs:
      gki_tag: { type: string, default: "android14-6.1-2026-03_r9" }
      manifest_branch: { type: string, default: "common-android14-6.1" }
      target: { type: string, default: "//common:kernel_aarch64_dist" }
      ksun_ref: { type: string, default: "v3.3.0" }
      use_droidspaces: { type: boolean, default: true }
      use_ksu: { type: boolean, default: true }

permissions:
  contents: write   # publish the release (boot+vbmeta+kernel+source)

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Specs
        run: |
          echo "cores $(nproc)"; free -h | sed -n 2p; df -h / | tail -1

      - name: Free up disk
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 2048
          build-mount-path: '/mnt/build'
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      - name: Volume + swap
        run: |
          sudo chown -R runner:runner /mnt/build
          echo "WS=/mnt/build/ws" >> $GITHUB_ENV
          sudo fallocate -l 24G /mnt/build/swapfile && sudo chmod 600 /mnt/build/swapfile
          sudo mkswap /mnt/build/swapfile >/dev/null && sudo swapon /mnt/build/swapfile
          free -h; df -h / /mnt/build | tail -2

      - name: Checkout deste repo (flash-recipe/patch-vbmeta.py)
        uses: actions/checkout@v4
        with:
          path: _repo

      - name: Dependencies + repo
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3 git curl unzip zip rsync bc bison flex libssl-dev
          mkdir -p ~/.local/bin
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o ~/.local/bin/repo
          chmod +x ~/.local/bin/repo; echo "$HOME/.local/bin" >> $GITHUB_PATH
          git config --global user.email ci@localhost; git config --global user.name ci

      - name: repo sync (GKI manifest PADRAO)
        run: |
          mkdir -p "$WS" && cd "$WS"
          repo init -q -u https://android.googlesource.com/kernel/manifest -b "${{ inputs.manifest_branch }}" --depth=1
          repo sync -c -j$(nproc) --no-tags --fail-fast
          du -sh .; df -h / /mnt/build | tail -2

      - name: Checkout common na TAG do stock
        run: |
          cd "$WS/common"
          git fetch --depth=1 https://android.googlesource.com/kernel/common "refs/tags/${{ inputs.gki_tag }}"
          git checkout -q FETCH_HEAD
          H=$(git rev-parse HEAD)
          # CMF Phone 1 (Tetris/A015): android14-6.1-2026-03_r9, SUBLEVEL=162.
          # This is the tree Google built the stock kernel from - its commit date
          # (Mon Apr 20 09:18:56 2026) matches the device's /proc/version exactly.
          [ "$H" = "65896c4edca1614fb2844dc27399c9347d28f86d" ] || { echo "🔴 SHA mismatch: $H"; exit 1; }
          echo "HEAD=$H  SUBLEVEL=$(grep -E '^SUBLEVEL' Makefile)"

      - name: Remove GKI protected exports (wifi/bt fix on custom kernel)
        run: |
          # ROOT CAUSE (2026-08-26) of phase 2 having no wifi: on a custom kernel the signing key is
          # OURS, so the stock GKI modules (rfkill/cfg80211/mac80211, signed by Google) are "unsigned"
          # to us and CANNOT resolve the PROTECTED SYMBOLS -> the rfkill->cfg80211->mac80211->wlan_drv
          # chain never comes up -> no wifi. Standard GKI community fix: drop the protected exports list
          # from common. It is invisible to a defconfig diff: it targets BUILD.bazel, not Kconfig.
          cd "$WS/common"
          FILES=$(ls android/abi_gki_protected_exports_* 2>/dev/null || true)
          sed -i '/protected_exports_list/d' BUILD.bazel
          rm -f android/abi_gki_protected_exports_*
          git update-index --assume-unchanged BUILD.bazel $FILES 2>/dev/null || true
          echo "--- protected_exports_list no BUILD.bazel (deve sumir):"
          grep -n protected_exports_list BUILD.bazel && { echo "ainda tem"; exit 1; } || echo "  (removido OK)"
          ls android/abi_gki_protected_exports_* 2>/dev/null && { echo "abi still present"; exit 1; } || echo "--- abi_gki_protected_exports_* removed OK"

      - name: Droidspaces (sysvipc kABI + ntsync) + container configs
        if: inputs.use_droidspaces
        run: |
          cd "$WS/common"
          # sysvipc kABI patch: parks sysvsem/sysvshm in ANDROID_KABI_RESERVE(6/7/8)
          # instead of the struct body, so task_struct keeps its stock layout and the
          # CRCs the stock vendor_dlkm modules were built against stay valid.
          # android_kabi.h:61 collapses _ANDROID_KABI_REPLACE to the original field
          # under __GENKSYMS__, which is what makes this CRC-transparent.
          # NB: this repo is checked out with `path: _repo`, not at the workspace root.
          P="$GITHUB_WORKSPACE/_repo/.github/patches"
          ls -l "$P"
          patch -p1 < "$P/fix_sysvipc_kabi.patch"
          # ntsync_base_compat.patch is deliberately NOT applied. NTSYNC emulates
          # Windows NT sync primitives for Wine/Proton; the upstream workflow bundles
          # it under the same "Droidspaces & NTSYNC" flag but the container runtime
          # does not use it. Here it builds as a module and modpost dies on
          #   "__vfs_setxattr_noperm" [drivers/misc/ntsync.ko] undefined
          # because that symbol is not exported. Nothing we want depends on it.
          # Droidspaces needs these five; the rest it wants are already on in stock.
          # CGROUP_DEVICE/CGROUP_PIDS are deliberately NOT enabled - adding a cgroup
          # subsystem changes CGROUP_SUBSYS_COUNT and resizes css_set, which would
          # break exactly the kABI this whole exercise is protecting.
          # kleaf runs `make savedefconfig` and REJECTS a defconfig that is not in
          # canonical minimal form, so these cannot simply be appended - each has to
          # land in the slot savedefconfig would put it in.
          #   SYSVIPC      -> line 2, immediately before POSIX_MQUEUE
          #   PID_NS       -> just drop the explicit disable; y is the default once
          #                   NAMESPACES=y, so savedefconfig omits it entirely
          #   DEVTMPFS     -> directly after CONFIG_PCI_ENDPOINT=y
          # POSIX_MQUEUE is already =y and IPC_NS already defaults on: no edit needed.
          D=arch/arm64/configs/gki_defconfig
          sed -i '1a CONFIG_SYSVIPC=y' "$D"
          sed -i '/^# CONFIG_PID_NS is not set$/d' "$D"
          sed -i '/^CONFIG_PCI_ENDPOINT=y$/a CONFIG_DEVTMPFS=y' "$D"
          # USER_NS: kABI-safe - cred.h:36 declares user_ns unconditionally, so the
          # struct layout does not move; CONFIG_USER_NS only switches
          # current_user_ns() from a constant to a field read. Canonical slot is
          # between IPC_NS and PID_NS (init/Kconfig 1238 < 1246 < 1260); neither
          # neighbour is listed, so it lands right after NAMESPACES.
          sed -i '/^CONFIG_NAMESPACES=y$/a CONFIG_USER_NS=y' "$D"
          # ADDRTYPE: GKI-mandatory per the Droidspaces docs, and what Docker's
          # port-publishing rules (-m addrtype --dst-type LOCAL) are built on.
          # Canonical slot is between TARGET_TCPMSS and MATCH_BPF.
          sed -i '/^CONFIG_NETFILTER_XT_TARGET_TCPMSS=y$/a CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y' "$D"
          echo "--- droidspaces defconfig edits:"
          grep -nE "^CONFIG_(SYSVIPC|POSIX_MQUEUE|DEVTMPFS)=y|CONFIG_PID_NS" "$D"
          # keep the tree clean so git-describe does not append -dirty to vermagic
          git update-index --assume-unchanged $(git ls-files -m) 2>/dev/null || true
          echo "--- scmversion (must NOT contain -dirty):"; ./scripts/setlocalversion || true

      - name: Integrate OFFICIAL KSU-Next (built-in, no susfs)
        id: ksu
        if: inputs.use_ksu
        run: |
          cd "$WS"
          KSUN_REF="${{ inputs.ksun_ref }}"
          # OFFICIAL setup.sh from rifsxd (KernelSU-Next/KernelSU-Next). $KSUN_REF = tag to check out.
          ( cd common && curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/${KSUN_REF}/kernel/setup.sh" | bash -s "$KSUN_REF" )
          # the setup creates drivers/kernelsu (symlink) + KernelSU-Next/ and edits drivers/ Kconfig/Makefile
          ls -d common/KernelSU-Next 2>/dev/null || ls -l common/drivers/kernelsu 2>/dev/null || { echo "🔴 setup.sh failed"; exit 1; }
          echo "--- integrated KSU-Next version:"; ( cd common/KernelSU-Next 2>/dev/null && git describe --tags 2>/dev/null || cat kernel/Makefile 2>/dev/null | grep -m1 -i version || true )
          # === VERSION BAKER (v0.0.1 fix): Kbuild computes KSU_VERSION=30000+git-rev-count from git
          #     itself, but the Bazel sandbox has NO .git -> fallback (1 / v0.0.1) -> su breaks and the
          #     manager shows up as "legacy". We compute it here (the clone HAS git) and inject a literal. ===
          ( cd common/KernelSU-Next && ( [ -f .git/shallow ] && git fetch --unshallow -q 2>/dev/null || git fetch -q --tags 2>/dev/null || true ) )
          KV=$(cd common/KernelSU-Next && git rev-list --count HEAD 2>/dev/null)
          KT=$(cd common/KernelSU-Next && git describe --tags --abbrev=0 2>/dev/null || echo "$KSUN_REF")
          [ -n "$KV" ] && [ "$KV" -gt 1 ] || { echo "🔴 invalid KSU_GIT_VERSION ($KV)"; exit 1; }
          KB=common/KernelSU-Next/kernel/Kbuild
          sed -i "s|^# Check if this is a git repository|KSU_GIT_VERSION := ${KV}\nKSU_GIT_TAG := ${KT}\nKSU_GIT_VERSION_VALID := 1\n# Check if this is a git repository|" "$KB"
          echo "--- BAKED KSU: KSU_GIT_VERSION=${KV}  KSU_VERSION=$((30000+KV))  tag=${KT}"
          echo "ksu_version=$((30000+KV))" >> "$GITHUB_OUTPUT"
          grep -nE "KSU_GIT_VERSION :=|KSU_GIT_TAG :=|KSU_GIT_VERSION_VALID :=" "$KB" | head
          # keep git-describe CLEAN (otherwise KSU leaves the tree -dirty and vermagic would turn ...-dirty).
          ( cd common && git update-index --assume-unchanged $(git ls-files -m) 2>/dev/null || true )
          echo "--- scmversion (must be -gd77c4cd65aed, WITHOUT -dirty):"; ( cd common && ./scripts/setlocalversion 2>/dev/null || true )

      - name: Build (common + official KSU-Next)
        id: build
        env:
          # Tetris/A015 stock: 6.1.162-android14-11-g65896c4edca1-ab15242664
          # BUILD_NUMBER supplies the -ab suffix (setlocalversion, last block);
          # -g65896c4edca1 comes naturally from git describe on the checked-out tag.
          BUILD_NUMBER: "15242664"
          SOURCE_DATE_EPOCH: "1776676736"   # Mon Apr 20 09:18:56 2026 UTC
        run: |
          set -o pipefail
          cd "$WS"
          BZ=/mnt/build/bazel-root; mkdir -p "$BZ"
          tools/bazel --output_user_root="$BZ" run --config=stamp --notrim "${{ inputs.target }}" -- --dist_dir="$PWD/dist" 2>&1 | tail -100
          rc=${PIPESTATUS[0]}
          echo "===== CONFIG_KSU no .config ====="
          find /mnt/build -name '.config' 2>/dev/null | xargs -r grep -l 'CONFIG_KSU=' 2>/dev/null | head -1 \
            | xargs -r grep -E 'CONFIG_KSU=|CONFIG_KSU_' 2>/dev/null || echo "(KSU not in .config!)"
          echo "--- disk:"; df -h / /mnt/build | tail -2
          exit $rc

      - name: Output + Linux version + markers
        if: always()
        run: |
          ls -lh "$WS/dist" 2>/dev/null | grep -iE 'image|symvers' || echo "no dist/"
          IMG=$(find "$WS/dist" -maxdepth 1 -name 'Image' | head -1)
          if [ -n "$IMG" ]; then
            echo "=== Linux version (byte for byte?) ==="; strings "$IMG" | grep -m1 'Linux version'
            echo "=== KSU markers ==="; strings "$IMG" | grep -iE 'kernelsu|susfs' | sort -u | head -12
          fi

      - name: Package the corresponding SOURCE (GPL) - the exact tree that was compiled
        if: success()
        run: |
          # GPL-2.0: whoever distributes the binary must offer the corresponding source.
          # This produces the EXACT `common/` tree that built this Image (GKI common at the stock
          # tag + integrated KernelSU-Next + the version baker), without .git and without bazel output.
          # It ships as a release asset next to the kernel. It is not an AOSP mirror: it is what compiled.
          cd "$WS"
          tar --exclude='.git' --exclude='bazel-*' --exclude='out' \
              -I 'zstd -T0 -12' -cf "$WS/dist/vienna-kernel-source-corresponding.tar.zst" common
          ls -lh "$WS/dist/vienna-kernel-source-corresponding.tar.zst"
          sha256sum "$WS/dist/vienna-kernel-source-corresponding.tar.zst"
          echo "--- revisions that make up this tree (the recipe, to reproduce):"
          echo "  GKI common : ${{ inputs.gki_tag }} (android.googlesource.com/kernel/common)"
          echo "  KernelSU-Next: ${{ inputs.ksun_ref }} (github.com/KernelSU-Next/KernelSU-Next)"

      - name: Stage Image into workspace for upload
        if: always()
        run: |
          mkdir -p "$GITHUB_WORKSPACE/out-tetris"
          for f in Image Image.lz4 Image.gz Module.symvers; do
            [ -f "$WS/dist/$f" ] && cp "$WS/dist/$f" "$GITHUB_WORKSPACE/out-tetris/" && echo "staged $f"
          done
          # record what we actually built, so verification does not depend on log scraping
          if [ -f "$GITHUB_WORKSPACE/out-tetris/Image" ]; then
            strings "$GITHUB_WORKSPACE/out-tetris/Image" | grep -m1 'Linux version' \
              > "$GITHUB_WORKSPACE/out-tetris/linux-version.txt"
            cat "$GITHUB_WORKSPACE/out-tetris/linux-version.txt"
          fi
          ls -lh "$GITHUB_WORKSPACE/out-tetris/" || true

      - name: Upload Image (Tetris - we repack/flash locally)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tetris-kernel-image
          path: out-tetris/
          if-no-files-found: warn

      # vienna's vbmeta recipe is for Motorola's LK, which REFUSES `fastboot flash boot`
      # unless vbmeta already describes the image. Nothing's LK accepted our plain
      # `fastboot flash boot_a` write, so we repack and flash locally instead.
      - name: Package flashable boot + patched vbmeta + publish release
        if: false
        env:
          GH_TOKEN: ${{ github.token }}
          DEVICE_TAG: W1UIS36H.39-17-8
          STOCK_RELEASE: stock-MMI-W1UIS36H.39-17-8
          KSU_VERSION: ${{ steps.ksu.outputs.ksu_version }}
        run: |
          set -e
          cd "$WS/dist"
          # boot-gz.img: directly in dist or inside boot-img*.tar.gz
          if [ ! -f boot-gz.img ]; then
            BT=$(ls boot-img*.tar.gz boot_img*.tar.gz 2>/dev/null | head -1)
            [ -n "$BT" ] && tar xzf "$BT" || true
          fi
          [ -f boot-gz.img ] || { echo "boot-gz.img missing from dist"; ls -l; exit 1; }
          # tools: standalone avbtool.py (AOSP) + patch-vbmeta.py (repo) + stock vbmeta (public release)
          curl -fsSL "https://android.googlesource.com/platform/external/avb/+/refs/heads/main/avbtool.py?format=TEXT" | base64 -d > /tmp/avbtool.py
          PV="$GITHUB_WORKSPACE/_repo/flash-recipe/patch-vbmeta.py"
          [ -f "$PV" ] || { echo "patch-vbmeta.py missing (checkout _repo?)"; exit 1; }
          gh release download "$STOCK_RELEASE" -R "$GITHUB_REPOSITORY" -p 'vbmeta--*.img' -D /tmp --clobber
          VB=$(ls /tmp/vbmeta--*.img | head -1); [ -f "$VB" ] || { echo "stock vbmeta did not download"; exit 1; }
          # mkbootimg-free recipe (PROVEN 2026-09-02): kleaf boot-gz -> re-footer with stock salt -> patch stock vbmeta
          ORIG=$(python3 /tmp/avbtool.py info_image --image boot-gz.img | awk '/Image Size:/{print $3; exit}')
          head -c "$ORIG" boot-gz.img > boot-raw.img
          SALT=$(python3 "$PV" --print-salt "$VB")
          cp boot-raw.img boot-new.img
          python3 /tmp/avbtool.py add_hash_footer --image boot-new.img --partition_name boot --partition_size 67108864 --salt "$SALT"
          python3 "$PV" "$VB" boot-raw.img vbmeta-new.img
          BD=$(python3 /tmp/avbtool.py info_image --image boot-new.img  | awk '/Hash descriptor/{h=1} h&&/Digest:/{print $2;exit}')
          VD=$(python3 /tmp/avbtool.py info_image --image vbmeta-new.img | awk '/Partition Name: *boot/{p=1} p&&/Digest:/{print $2;exit}')
          [ "$BD" = "$VD" ] || { echo "boot/vbmeta DID NOT match: $BD vs $VD"; exit 1; }
          echo "matched pair: $BD"
          N="custom-KernelSU-Next-${KSU_VERSION}"; D="$DEVICE_TAG"
          GZ=$(ls *.gz | grep -iE 'image' | head -1)
          cp "$GZ"          "kernel--${N}--${D}.Image.gz"
          cp boot-new.img   "boot--${N}--${D}.img"
          cp vbmeta-new.img "vbmeta--${N}--${D}.img"
          [ -f vienna-kernel-source-corresponding.tar.zst ] && cp vienna-kernel-source-corresponding.tar.zst "source--${N}--${D}.tar.zst" || true
          SV=$(ls *symvers* 2>/dev/null | head -1); [ -n "$SV" ] && cp "$SV" "Module--${N}--${D}.symvers" || true
          ASSETS="boot--${N}--${D}.img vbmeta--${N}--${D}.img kernel--${N}--${D}.Image.gz"
          [ -f "source--${N}--${D}.tar.zst" ] && ASSETS="$ASSETS source--${N}--${D}.tar.zst"
          [ -f "Module--${N}--${D}.symvers" ] && ASSETS="$ASSETS Module--${N}--${D}.symvers"
          sha256sum $ASSETS > SHA256SUMS; ASSETS="$ASSETS SHA256SUMS"; cat SHA256SUMS
          TAG="${N}-MMI-${D}"
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" -R "$GITHUB_REPOSITORY" $ASSETS --clobber
          else
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --latest=false \
              -t "Custom kernel: KernelSU-Next built-in (${KSU_VERSION}), ${D} (Android)" \
              -n "Autobuild following the KSU-Next CI. MATCHED boot+vbmeta pair (${BD}) - flash the PAIR, vbmeta first (boot passes preflash). Regeneration/recipe in flash-recipe/. Kernel GPL-2.0, corresponding source attached. WARNING: a custom built-in boot can bootloop on vienna even with a matched vbmeta - keep a phase-1 recovery (stock boot + init_boot LKM). NOTE: this release is deliberately NOT marked Latest - the LKM line (root-lkm-*) is the Latest one." \
              $ASSETS
          fi
          echo "RELEASE $TAG published."

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vienna-gki-ksu-nosusfs
          path: |
            /mnt/build/ws/dist/Image*
            /mnt/build/ws/dist/*.gz
            /mnt/build/ws/dist/*symvers*
            /mnt/build/ws/dist/vienna-kernel-source-corresponding.tar.zst
          if-no-files-found: warn
          retention-days: 14
